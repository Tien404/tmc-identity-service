spring.application.name=tmc-identity-service
server.port=8081
server.address=127.0.0.1

# Base64 secret (32+ bytes) for signing QR tokens, e.g. from: openssl rand -base64 32
# If empty, a random key is used and issued QR codes stop working after a restart.
identity.token.secret=${IDENTITY_TOKEN_SECRET:}
